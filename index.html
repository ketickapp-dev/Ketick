<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketick - Log Masuk</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Tetapan Asas & Tema Flux Edition */
        :root {
            --bg-dark: #09090b;
            --card-surface: rgba(255, 255, 255, 0.03);
            --flux-cyan: #00FFC2;
            --flux-purple: #8B5CF6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(0, 0, 0, 0.2);
            --radius-bento: 32px;
            --radius-btn: 16px;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 194, 0.1), transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Kad Log Masuk Utama */
        .login-container {
            background: var(--card-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-bento);
            padding: 3rem 2rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            
            /* Animasi Masuk (Entry Animation) */
            transform: translateY(30px);
            opacity: 0;
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUpFade {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Teks Pengepala */
        .header-text {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-text h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            background: linear-gradient(135deg, var(--flux-cyan), var(--flux-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .header-text p {
            color: var(--text-dim);
            margin: 0;
            font-size: 0.95rem;
        }

        /* Ruang Input */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .flux-input {
            width: 100%;
            padding: 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-btn);
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Micro Interaction: Focus pada Input */
        .flux-input:focus {
            border-color: rgba(0, 255, 194, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 194, 0.15);
            background: rgba(0, 0, 0, 0.4);
        }

        /* Butang Log Masuk */
        .flux-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--flux-purple), #C084FC);
            border: none;
            border-radius: var(--radius-btn);
            padding: 1rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
            margin-top: 1rem;
        }

        .flux-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(139, 92, 246, 0.4);
        }

        .flux-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-text">
            <h1>Ketick</h1>
            <p>Log masuk untuk urus perniagaan anda</p>
        </div>

        <form action="dashboard.html" method="GET">
            <div class="input-group">
                <label for="email">E-mel Pengguna</label>
                <input type="email" id="email" class="flux-input" placeholder="nama@syarikat.com" required>
            </div>

            <div class="input-group">
                <label for="password">Kata Laluan</label>
                <input type="password" id="password" class="flux-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="flux-btn">Log Masuk Ruang Kerja</button>
        </form>
    </div>

</body>
</html>
